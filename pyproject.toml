[project]
name = "learnfromvideo"
version = "0.2.1"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = "LicenseRef-Hypit-Additional-Conditions"
license-files = ["LICENSE", "NOTICE"]
keywords = ["video", "agent", "learning", "transcription", "yt-dlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
description = "Evidence-first video learning tools for AI agents"
dependencies = ["yt-dlp[default,curl-cffi]>=2026.3.17", "Pillow>=11", "requests>=2.32"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2"]

[project.scripts]
lfv = "learnfromvideo.cli:main"

[project.urls]
Repository = "https://github.com/jiangkuo888/LearnFromVideo"
Issues = "https://github.com/jiangkuo888/LearnFromVideo/issues"
Documentation = "https://github.com/jiangkuo888/LearnFromVideo/blob/main/docs/QUICKSTART.md"
Changelog = "https://github.com/jiangkuo888/LearnFromVideo/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
